[project]
name = "opencast-pika-runtime"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "aiohttp>=3.11.8",
    "alembic",
    "av==17.1.0",
    "blake3",
    "comfy-aimdo==0.5.6",
    "comfy-angle",
    "comfy-kitchen==0.2.39",
    "comfyui-embedded-docs==0.5.14",
    "comfyui-frontend-package==1.55.18",
    "comfyui-workflow-templates==0.11.89",
    "einops",
    "filelock",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow",
    "psutil",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pyopengl>=3.1.8",
    "pytest",
    "pyyaml",
    "requests",
    "safetensors>=0.4.2",
    "scipy",
    "sentencepiece",
    "simpleeval>=1.0.0",
    "spandrel",
    "sqlalchemy>=2.0.0",
    "tokenizers>=0.13.3",
    "torch==2.11.0",
    "torchsde",
    "torchvision",
    "tqdm",
    "transformers==4.57.6",
    "yarl>=1.18.0",
]

[tool.comfygit]
schema_version = 2
comfyui_version = "63be2f9b82ad0dac88a7ceaa28a9cf3154125a18"
comfyui_version_type = "commit"
comfyui_commit_sha = "63be2f9b82ad0dac88a7ceaa28a9cf3154125a18"
python_version = "3.11"
headless = true


[tool.uv]
override-dependencies = ["uv>=0.11.8"]
exclude-dependencies = ["opencv-contrib-python", "opencv-python", "opencv-python-headless"]

[dependency-groups]
comfygit-system = ["uv>=0.11.8"]
