[project]
name = "opencast-krea-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp>=3.11.8",
    "alembic",
    "av>=17.0.0",
    "blake3",
    "comfy-aimdo==0.5.6",
    "comfy-angle",
    "comfy-kitchen==0.2.38",
    "comfygit-core",
    "comfyui-embedded-docs==0.5.14",
    "comfyui-frontend-package==1.55.17",
    "comfyui-workflow-templates==0.11.89",
    "einops",
    "filelock",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow",
    "psutil",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pyopengl>=3.1.8",
    "pyyaml",
    "requests",
    "safetensors>=0.4.2",
    "scipy",
    "sentencepiece",
    "simpleeval>=1.0.0",
    "spandrel",
    "sqlalchemy>=2.0.0",
    "tokenizers>=0.13.3",
    "torch==2.14.1",
    "torchsde",
    "torchvision",
    "tqdm",
    "transformers==5.20.1",
    "yarl>=1.18.0",
]

[tool.comfygit]
schema_version = 2
comfyui_version = "c9ea36b9d2140c89b2ef84f93f428df474e72ba5"
comfyui_version_type = "commit"
comfyui_commit_sha = "c9ea36b9d2140c89b2ef84f93f428df474e72ba5"
comfyui_repository = "https://github.com/Comfy-Org/ComfyUI.git"
python_version = "3.12"

[tool.comfygit.nodes.comfygit-manager]
name = "comfygit-manager"
registry_id = "comfygit-manager"
repository = "https://github.com/comfygit-ai/comfygit-manager"
version = "0.3.2"
download_url = "https://cdn.comfy.org/akatz/comfygit-manager/0.3.2/node.zip"
source = "registry"
criticality = "required"


[tool.comfygit.nodes.rebels-krea2-outpaint]
